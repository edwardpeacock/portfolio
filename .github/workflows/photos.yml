# Photography: whenever photos are added to (or removed from) assets/photos/, or order.txt is edited,
# resize them for the web, strip hidden camera/location data, update the order and photos.json, and save the result.
name: Update photos

on:
  push:
    branches: [main]
    paths:
      - "assets/photos/**"
      - "photo-originals/**"
      - "tools/build_photos.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif
      - run: python tools/build_photos.py
      - name: Save the web-ready photos
        run: |
          git config user.name "photo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/photos
          if git diff --cached --quiet; then echo "Nothing to change"; exit 0; fi
          git commit -m "Photos: resized for the web and order updated"
          git push
